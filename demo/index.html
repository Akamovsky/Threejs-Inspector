<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Inspector Demo Playground</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
        font-family: sans-serif;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(15, 23, 42, 0.85);
        color: #f8fafc;
        padding: 12px 16px;
        border-radius: 8px;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        pointer-events: none;
      }
      h1 {
        margin: 0 0 6px 0;
        font-size: 16px;
        font-weight: 600;
        color: #38bdf8;
      }
      p {
        margin: 0;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="overlay">
      <h1>Three.js Playground Scene</h1>
      <p>Use Three.js Inspector DevTools to inspect and tweak objects in real-time.</p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
